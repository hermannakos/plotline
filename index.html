<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plotline — Cinematic Universe Watch Order</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d0f;
      --surface: #18181c;
      --surface2: #222228;
      --border: #2e2e38;
      --text: #e8e8f0;
      --muted: #888899;
      --radius: 10px;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }
    #root { display: flex; flex-direction: column; min-height: 100vh; }

    /* ── Header ─────────────────────────────────────── */
    .app-header {
      padding: 28px 24px 0;
      text-align: center;
    }
    .app-header h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .app-header p { color: var(--muted); margin-top: 6px; font-size: 0.95rem; }

    /* ── Universe Tabs ───────────────────────────────── */
    .universe-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      padding: 24px 16px 0;
    }
    .universe-tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 999px;
      border: 2px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
      white-space: nowrap;
    }
    .universe-tab:hover { border-color: #555; color: var(--text); }
    .universe-tab.active {
      color: #fff;
      border-color: var(--tab-color, #888);
      background: color-mix(in srgb, var(--tab-color, #888) 18%, var(--surface));
      box-shadow: 0 0 14px color-mix(in srgb, var(--tab-color, #888) 35%, transparent);
    }
    .tab-emoji { font-size: 1.1rem; }

    /* ── Progress Bar ────────────────────────────────── */
    .progress-bar-wrap {
      max-width: 700px;
      margin: 18px auto 0;
      padding: 0 16px;
    }
    .progress-bar-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .progress-bar-track {
      height: 6px;
      border-radius: 3px;
      background: var(--border);
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    /* ── Stats Row ───────────────────────────────────── */
    .stats-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 16px 16px 0;
    }
    .stat-pill {
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--surface2);
      border: 1px solid var(--border);
      font-size: 0.82rem;
      color: var(--muted);
    }
    .stat-pill strong { color: var(--text); }

    /* ── Phase Groups ────────────────────────────────── */
    .content { padding: 24px 16px 60px; max-width: 960px; margin: 0 auto; width: 100%; }
    .phase-group { margin-bottom: 32px; }
    .phase-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .phase-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--muted);
    }
    .phase-line { flex: 1; height: 1px; background: var(--border); }
    .phase-count {
      font-size: 0.75rem;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 999px;
    }

    /* ── Entry Card ──────────────────────────────────── */
    .entries-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px;
    }
    .entry-card {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 14px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
    }
    .entry-card:hover {
      border-color: #444;
      background: var(--surface2);
      transform: translateY(-1px);
    }
    .entry-card.watched {
      opacity: 0.55;
    }
    .entry-card.watched .entry-title { text-decoration: line-through; }
    .entry-card.crossover {
      border-color: color-mix(in srgb, var(--universe-accent, #FFD700) 40%, var(--border));
      background: color-mix(in srgb, var(--universe-accent, #FFD700) 5%, var(--surface));
    }
    .entry-check {
      width: 20px;
      height: 20px;
      min-width: 20px;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
      transition: all 0.15s ease;
    }
    .entry-card.watched .entry-check {
      background: var(--universe-color, #888);
      border-color: var(--universe-color, #888);
    }
    .checkmark { font-size: 11px; color: #fff; }
    .entry-body { flex: 1; min-width: 0; }
    .entry-title {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.35;
      margin-bottom: 5px;
    }
    .entry-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
    }
    .badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-year { background: var(--surface2); color: var(--muted); }
    .badge-movie { background: #1a3a6e33; color: #7aabff; }
    .badge-series { background: #1a4d3e33; color: #7affd4; }
    .badge-crossover { background: color-mix(in srgb, var(--universe-accent, #FFD700) 20%, transparent); color: var(--universe-accent, #FFD700); }
    .badge-show { font-size: 0.68rem; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
    .entry-note { font-size: 0.72rem; color: var(--muted); margin-top: 4px; font-style: italic; }
    .entry-episodes { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

    /* ── Episode Breakdown ───────────────────────────── */
    .entry-title-row {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      margin-bottom: 5px;
    }
    .entry-title-row .entry-title { flex: 1; margin-bottom: 0; }
    .expand-btn {
      background: none;
      border: 1px solid var(--border);
      cursor: pointer;
      color: var(--muted);
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      line-height: 1.4;
      transition: all 0.15s ease;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .expand-btn:hover { color: var(--text); border-color: #555; }
    .ep-progress {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 3px;
    }
    .ep-progress-bar {
      height: 3px;
      border-radius: 2px;
      background: var(--border);
      overflow: hidden;
      margin-top: 4px;
    }
    .ep-progress-fill {
      height: 100%;
      border-radius: 2px;
      background: var(--universe-color, #888);
      transition: width 0.3s ease;
    }
    .episode-list {
      margin-top: 10px;
      border-top: 1px solid var(--border);
      padding-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .episode-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 6px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.12s ease;
    }
    .episode-item:hover { background: var(--border); }
    .episode-item.ep-watched { opacity: 0.55; }
    .episode-item.ep-watched .episode-label { text-decoration: line-through; }
    .episode-check {
      width: 15px;
      height: 15px;
      min-width: 15px;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .episode-check.ep-done {
      background: var(--universe-color, #888);
      border-color: var(--universe-color, #888);
    }
    .ep-checkmark { font-size: 8px; color: #fff; }
    .episode-label { font-size: 0.78rem; color: var(--text); }

    /* ── Footer ──────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 20px;
      color: var(--muted);
      font-size: 0.78rem;
      border-top: 1px solid var(--border);
      margin-top: auto;
    }

    /* ── Up Next ─────────────────────────────────────── */
    .up-next-wrap {
      max-width: 700px;
      margin: 16px auto 0;
      padding: 0 16px;
    }
    .up-next-card {
      background: var(--surface);
      border: 1px solid color-mix(in srgb, var(--universe-color, #888) 40%, var(--border));
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .up-next-label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--universe-color, #888);
      white-space: nowrap;
    }
    .up-next-info {
      flex: 1;
      min-width: 0;
    }
    .up-next-title {
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .up-next-sub {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .up-next-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .up-next-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: none;
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .up-next-btn:hover { background: var(--surface2); border-color: #555; }
    .up-next-btn.primary {
      background: color-mix(in srgb, var(--universe-color, #888) 20%, var(--surface));
      border-color: var(--universe-color, #888);
      color: #fff;
    }
    .up-next-btn.primary:hover {
      background: color-mix(in srgb, var(--universe-color, #888) 35%, var(--surface));
    }

    /* ── Responsive ──────────────────────────────────── */
    @media (max-width: 500px) {
      .entries-grid { grid-template-columns: 1fr; }
      .universe-tab { padding: 8px 12px; font-size: 0.82rem; }
      .up-next-card { flex-wrap: wrap; gap: 10px; }
      .up-next-actions { width: 100%; gap: 8px; }
      .up-next-btn { flex: 1; text-align: center; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useCallback } = React;

/* ── Helpers ────────────────────────────────────────────────────── */
function groupByPhase(entries) {
  const map = new Map();
  for (const entry of entries) {
    if (!map.has(entry.phase)) map.set(entry.phase, []);
    map.get(entry.phase).push(entry);
  }
  return map;
}

function loadWatched(uid) {
  try {
    const raw = localStorage.getItem(`plotline_watched_${uid}`);
    return raw ? new Set(JSON.parse(raw)) : new Set();
  } catch { return new Set(); }
}

function saveWatched(uid, set) {
  try {
    localStorage.setItem(`plotline_watched_${uid}`, JSON.stringify([...set]));
  } catch {}
}

/* ── Episode helpers ────────────────────────────────────────────── */
function isSeriesWatched(entryId, episodes, watchedSet) {
  for (let i = 1; i <= episodes; i++) {
    if (!watchedSet.has(`${entryId}_ep_${i}`)) return false;
  }
  return true;
}

function countWatchedEpisodes(entryId, episodes, watchedSet) {
  let count = 0;
  for (let i = 1; i <= episodes; i++) {
    if (watchedSet.has(`${entryId}_ep_${i}`)) count++;
  }
  return count;
}

/* ── Up Next helper ─────────────────────────────────────────────── */
function getUpNext(entries, watchedSet) {
  for (const entry of entries) {
    if (entry.type === "Series" && entry.episodes > 0) {
      if (!isSeriesWatched(entry.id, entry.episodes, watchedSet)) {
        for (let i = 1; i <= entry.episodes; i++) {
          if (!watchedSet.has(`${entry.id}_ep_${i}`)) {
            return { entry, episode: i };
          }
        }
      }
    } else {
      if (!watchedSet.has(entry.id)) {
        return { entry, episode: null };
      }
    }
  }
  return null;
}

/* ── UpNextCard ─────────────────────────────────────────────────── */
function UpNextCard({ upNext, universe, onMarkWatched, onJumpTo }) {
  if (!upNext) return null;
  const { entry, episode } = upNext;
  const cssVars = { "--universe-color": universe.color };
  const sub = episode != null
    ? `Episode ${episode} of ${entry.episodes}`
    : entry.year;
  return (
    <div className="up-next-wrap">
      <div className="up-next-card" style={cssVars}>
        <span className="up-next-label">Up Next</span>
        <div className="up-next-info">
          <div className="up-next-title">{entry.title}</div>
          <div className="up-next-sub">{sub}</div>
        </div>
        <div className="up-next-actions">
          <button
            className="up-next-btn primary"
            onClick={onMarkWatched}
            title="Mark as watched"
          >
            ✓ Watched
          </button>
          <button
            className="up-next-btn"
            onClick={onJumpTo}
            title="Jump to this item in the list"
          >
            ↓ Jump
          </button>
        </div>
      </div>
    </div>
  );
}

/* ── EntryCard ──────────────────────────────────────────────────── */
function EntryCard({ entry, universe, watchedSet, onToggle, onToggleEpisode, shouldExpand }) {
  const [expanded, setExpanded] = useState(false);

  useEffect(() => {
    if (shouldExpand) setExpanded(true);
  }, [shouldExpand]);
  const isCrossover = entry.type === "Crossover";
  const hasEpisodes = entry.type === "Series" && entry.episodes > 0;
  const showColor = universe.showColors?.[entry.show] ?? universe.color;
  const cssVars = {
    "--universe-color":  universe.color,
    "--universe-accent": universe.accent,
  };

  const watched = hasEpisodes
    ? isSeriesWatched(entry.id, entry.episodes, watchedSet)
    : watchedSet.has(entry.id);
  const watchedEpCount = hasEpisodes
    ? countWatchedEpisodes(entry.id, entry.episodes, watchedSet)
    : 0;

  const handleCardClick = (e) => {
    if (e.target.closest(".expand-btn") || e.target.closest(".episode-list")) return;
    onToggle(entry);
  };

  const handleExpandClick = (e) => {
    e.stopPropagation();
    setExpanded(prev => !prev);
  };

  return (
    <div
      id={`entry-${entry.id}`}
      className={`entry-card${watched ? " watched" : ""}${isCrossover ? " crossover" : ""}`}
      style={cssVars}
      onClick={handleCardClick}
      title={watched ? "Mark as unwatched" : "Mark as watched"}
    >
      <div className="entry-check">
        {watched && <span className="checkmark">✓</span>}
      </div>
      <div className="entry-body">
        <div className={hasEpisodes ? "entry-title-row" : ""}>
          <div className="entry-title">{entry.title}</div>
          {hasEpisodes && (
            <button
              className="expand-btn"
              onClick={handleExpandClick}
              title={expanded ? "Collapse episodes" : "Show episodes"}
            >
              {expanded ? "▲" : "▼"}
            </button>
          )}
        </div>
        <div className="entry-meta">
          <span className="badge badge-year">{entry.year}</span>
          {entry.type === "Movie"    && <span className="badge badge-movie">Movie</span>}
          {entry.type === "Series"   && <span className="badge badge-series">Series</span>}
          {isCrossover               && <span className="badge badge-crossover" style={{ "--universe-accent": universe.accent }}>Crossover</span>}
          {entry.show && entry.show !== "CROSSOVER" && (
            <span className="badge badge-show" style={{ background: showColor + "33", color: showColor }}>{entry.show}</span>
          )}
        </div>
        {hasEpisodes && (
          <>
            <div className="ep-progress">{watchedEpCount} / {entry.episodes} episodes</div>
            <div className="ep-progress-bar">
              <div className="ep-progress-fill" style={{ width: `${Math.round((watchedEpCount / entry.episodes) * 100)}%` }} />
            </div>
          </>
        )}
        {entry.note && <div className="entry-note">{entry.note}</div>}
        {expanded && hasEpisodes && (
          <div className="episode-list" onClick={e => e.stopPropagation()}>
            {Array.from({ length: entry.episodes }, (_, i) => i + 1).map(epNum => {
              const epWatched = watchedSet.has(`${entry.id}_ep_${epNum}`);
              return (
                <div
                  key={epNum}
                  className={`episode-item${epWatched ? " ep-watched" : ""}`}
                  onClick={() => onToggleEpisode(entry.id, epNum)}
                >
                  <div className={`episode-check${epWatched ? " ep-done" : ""}`} style={cssVars}>
                    {epWatched && <span className="ep-checkmark">✓</span>}
                  </div>
                  <span className="episode-label">Episode {epNum}</span>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

/* ── App ────────────────────────────────────────────────────────── */
function App() {
  const [universes, setUniverses] = useState(null);
  const [loadError, setLoadError] = useState(null);
  const [activeId, setActiveId] = useState("mcu");
  const [watchedMap, setWatchedMap] = useState({});
  const [jumpExpandId, setJumpExpandId] = useState(null);

  useEffect(() => {
    fetch("./universes.json", { cache: "no-cache" })
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      .then(data => {
        setUniverses(data);
        const m = {};
        for (const uid of Object.keys(data)) m[uid] = loadWatched(uid);
        setWatchedMap(m);
      })
      .catch(err => setLoadError(err.message));
  }, []);

  const universe = universes?.[activeId];
  const watched  = watchedMap[activeId] ?? new Set();
  const entries  = universe?.entries ?? [];
  const phases   = useMemo(() => groupByPhase(entries), [entries]);

  const total    = entries.length;
  const doneCount = useMemo(() =>
    entries.filter(e =>
      e.type === "Series" && e.episodes
        ? isSeriesWatched(e.id, e.episodes, watched)
        : watched.has(e.id)
    ).length,
  [entries, watched]);
  const pct      = total === 0 ? 0 : Math.round((doneCount / total) * 100);

  const movies   = entries.filter(e => e.type === "Movie").length;
  const series   = entries.filter(e => e.type === "Series").length;
  const crossovers = entries.filter(e => e.type === "Crossover").length;

  const upNext = useMemo(() => getUpNext(entries, watched), [entries, watched]);

  const toggle = useCallback((entry) => {
    setWatchedMap(prev => {
      const set = new Set(prev[activeId]);
      if (entry.type === "Series" && entry.episodes) {
        const allWatched = isSeriesWatched(entry.id, entry.episodes, set);
        for (let i = 1; i <= entry.episodes; i++) {
          const epId = `${entry.id}_ep_${i}`;
          if (allWatched) set.delete(epId); else set.add(epId);
        }
      } else {
        if (set.has(entry.id)) set.delete(entry.id); else set.add(entry.id);
      }
      saveWatched(activeId, set);
      return { ...prev, [activeId]: set };
    });
  }, [activeId]);

  const toggleEpisode = useCallback((entryId, epNum) => {
    setWatchedMap(prev => {
      const set = new Set(prev[activeId]);
      const epId = `${entryId}_ep_${epNum}`;
      if (set.has(epId)) set.delete(epId); else set.add(epId);
      saveWatched(activeId, set);
      return { ...prev, [activeId]: set };
    });
  }, [activeId]);

  const handleUpNextWatched = useCallback(() => {
    if (!upNext) return;
    if (upNext.episode != null) {
      toggleEpisode(upNext.entry.id, upNext.episode);
    } else {
      toggle(upNext.entry);
    }
  }, [upNext, toggle, toggleEpisode]);

  const handleUpNextJump = useCallback(() => {
    if (!upNext) return;
    const el = document.getElementById(`entry-${upNext.entry.id}`);
    if (el) {
      const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      el.scrollIntoView({ behavior: prefersReducedMotion ? "auto" : "smooth", block: "center" });
    }
    if (upNext.episode != null) setJumpExpandId(upNext.entry.id);
  }, [upNext]);

  if (loadError) return <div style={{ padding: 40, textAlign: "center", color: "var(--muted)" }}>Failed to load: {loadError}</div>;
  if (!universes || !universe) return <div style={{ padding: 40, textAlign: "center", color: "var(--muted)" }}>Loading…</div>;

  return (
    <>
      <div className="app-header">
        <h1>🎬 Plotline</h1>
        <p>Your cinematic universe watch order tracker</p>
      </div>

      {/* Universe tabs */}
      <div className="universe-tabs">
        {Object.values(universes).map(u => (
          <button
            key={u.id}
            className={`universe-tab${activeId === u.id ? " active" : ""}`}
            style={{ "--tab-color": u.color }}
            onClick={() => { setActiveId(u.id); setJumpExpandId(null); }}
          >
            <span className="tab-emoji">{u.emoji}</span>
            <span>{u.short}</span>
          </button>
        ))}
      </div>

      {/* Progress */}
      <div className="progress-bar-wrap">
        <div className="progress-bar-row">
          <span>{universe.name}</span>
          <span>{doneCount} / {total} watched ({pct}%)</span>
        </div>
        <div className="progress-bar-track">
          <div
            className="progress-bar-fill"
            style={{ width: `${pct}%`, background: universe.color }}
          />
        </div>
      </div>

      {/* Stats */}
      <div className="stats-row">
        {movies    > 0 && <div className="stat-pill">🎬 <strong>{movies}</strong> movies</div>}
        {series    > 0 && <div className="stat-pill">📺 <strong>{series}</strong> series</div>}
        {crossovers> 0 && <div className="stat-pill">⚡ <strong>{crossovers}</strong> crossovers</div>}
        <div className="stat-pill">✅ <strong>{doneCount}</strong> watched</div>
      </div>

      {/* Up Next */}
      <UpNextCard
        upNext={upNext}
        universe={universe}
        onMarkWatched={handleUpNextWatched}
        onJumpTo={handleUpNextJump}
      />

      {/* Phase groups */}
      <div className="content">
        {[...phases.entries()].map(([phase, entries]) => (
          <div className="phase-group" key={phase}>
            <div className="phase-header">
              <span className="phase-title">{phase}</span>
              <div className="phase-line" />
              <span className="phase-count">{entries.length}</span>
            </div>
            <div className="entries-grid">
              {entries.map(entry => (
                <EntryCard
                  key={entry.id}
                  entry={entry}
                  universe={universe}
                  watchedSet={watched}
                  onToggle={toggle}
                  onToggleEpisode={toggleEpisode}
                  shouldExpand={jumpExpandId === entry.id}
                />
              ))}
            </div>
          </div>
        ))}
      </div>

      <footer>
        Built with ❤️ · <a href="https://github.com/hermannakos/plotline" style={{ color: "inherit" }}>GitHub</a>
      </footer>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
